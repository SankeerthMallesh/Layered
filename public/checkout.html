<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — Layerly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M7 12l9-5 9 5-9 5zM7 16l9 5 9-5' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://js.stripe.com/v3/"></script>
<style>
:root{--ink:#1a1f36;--mut:#6b7280;--bd:#d9dce1;--blue:#1556d6;--bg:#fff;--bg2:#f7f8fa;--err:#d92d20}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.left{padding:4.5rem 3rem 3rem;display:flex;justify-content:flex-end}
.left>div{width:100%;max-width:420px}
.right{background:var(--bg2);border-left:1px solid #eceef2;padding:4.5rem 3rem 3rem}
.right>div{width:100%;max-width:420px}
.brand{display:inline-flex;align-items:center;gap:.6rem;font-weight:600;font-size:1.05rem;color:var(--ink);text-decoration:none}
.brand svg{width:22px;height:22px}
.tag{color:var(--mut);margin:.9rem 0 2.2rem;font-size:.97rem}
.lbl{color:var(--mut);font-size:1.05rem}
.big{font-size:2.1rem;font-weight:700;margin:.35rem 0 1.6rem}
.line{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;font-size:.95rem}
.line small{display:block;color:var(--mut);font-size:.82rem;margin-top:.1rem}
hr{border:0;border-top:1px solid #e5e7eb;margin:1.2rem 0}
.row{display:flex;justify-content:space-between;padding:.4rem 0;font-size:.95rem}
.row.m{color:var(--mut)}
.row.t{font-weight:600}
.row.g{color:#0a7d4f}
.back{display:inline-block;margin-top:2rem;color:var(--mut);font-size:.88rem;text-decoration:none}
.back:hover{color:var(--ink)}

h4{margin:1.5rem 0 .55rem;font-size:.92rem;font-weight:600}
label{display:block;font-size:.88rem;margin:0 0 .4rem;color:var(--ink)}
input,select{width:100%;font:inherit;font-size:.97rem;color:var(--ink);background:#fff;border:1px solid var(--bd);border-radius:0;padding:.8rem .9rem;outline:none;appearance:none;-webkit-appearance:none}
input::placeholder{color:#9aa1ad}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,86,214,.15);position:relative;z-index:2}
input.bad,select.bad{border-color:var(--err)}
.email{border-radius:8px}
.box{border:1px solid var(--bd);border-radius:10px;background:#fff;padding:1rem}
.grp{display:flex;flex-direction:column}
.grp>*{margin-top:-1px}
.grp>:first-child{margin-top:0;border-radius:8px 8px 0 0}
.grp>:last-child{border-radius:0 0 8px 8px}
.grp .two{display:grid;grid-template-columns:1fr 1fr;margin-top:-1px}
.grp .two input{border-radius:0}
.grp .two input+input{margin-left:-1px}
.grp .three{display:grid;grid-template-columns:1.2fr .8fr 1fr;margin-top:-1px}
.grp .three input{border-radius:0}
.grp .three input+input{margin-left:-1px}
.grp .two:last-child input:first-child,.grp .three:last-child input:first-child{border-bottom-left-radius:8px}
.grp .two:last-child input:last-child,.grp .three:last-child input:last-child{border-bottom-right-radius:8px}
.sel{position:relative}
.sel:after{content:"";position:absolute;right:1rem;top:50%;width:7px;height:7px;border-right:2px solid #444;border-bottom:2px solid #444;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.opt{display:flex;align-items:center;justify-content:space-between;gap:.8rem;border:1px solid var(--bd);background:#fff;padding:.8rem .9rem;cursor:pointer;margin-top:-1px;font-size:.95rem}
.opt:first-child{margin-top:0;border-radius:8px 8px 0 0}.opt:last-child{border-radius:0 0 8px 8px}
.opt input{width:auto;margin:0 .6rem 0 0;appearance:auto;-webkit-appearance:auto;accent-color:var(--blue)}
.opt:has(input:checked){border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);position:relative;z-index:1}
.opt span:first-child{display:flex;align-items:center}
.opt small{color:var(--mut)}
.or{display:flex;align-items:center;gap:.8rem;color:#8a92a0;font-size:.72rem;letter-spacing:.05em;margin:1.3rem 0 .3rem}
.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--bd)}
#express{min-height:0}
#pay{width:100%;margin-top:1.5rem;padding:1rem;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;transition:filter .15s}
#pay:hover{filter:brightness(1.08)}
#pay:disabled{opacity:.6;cursor:default}
#msg{color:var(--err);font-size:.9rem;margin-top:1rem;min-height:1px}
.fine{color:var(--mut);font-size:.8rem;text-align:center;margin:1.2rem 0 0;line-height:1.5}
.fine b{color:#4b5563}
.empty{text-align:center;padding:3rem 0}
.empty a{color:var(--blue)}
[hidden]{display:none!important}
@media(max-width:820px){
 .wrap{grid-template-columns:1fr}
 .left,.right{padding:2rem 1.25rem;justify-content:center}
 .right{border-left:0;border-top:1px solid #eceef2}
 .big{font-size:1.8rem}
}
</style>
</head>
<body>
<div class="wrap">
 <section class="left"><div>
  <a class="brand" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><path d="M7 12l9-5 9 5-9 5zM7 16l9 5 9-5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>Layerly</a>
  <p class="tag">Secure checkout 🔒</p>
  <div class="lbl">Pay Layerly</div>
  <div class="big" id="big">$0.00</div>
  <div id="lines"></div>
  <hr>
  <div id="sum"></div>
  <a class="back" href="/">← Back to shop</a>
 </div></section>

 <section class="right"><div>
  <div class="empty" id="empty" hidden><p>Your cart is empty.</p><a href="/">Back to the shop</a></div>
  <div id="form" hidden>
   <label for="email">Your email (required: we send your receipt and order updates here)</label>
   <input id="email" class="email" type="email" autocomplete="email" placeholder="you@example.com" style="margin-bottom:1.2rem">
   <div id="exwrap" hidden><div id="express"></div><div class="or">OR PAY ANOTHER WAY</div></div>

   
   <h4>Payment method</h4>
   <div class="box"><div id="payment"></div></div>

   <h4>Shipping details</h4>
   <div class="grp">
    <input id="name" placeholder="Full name" autocomplete="name">
    <div class="sel"><select id="country" autocomplete="country"><option value="US">United States</option></select></div>
    <input id="line1" placeholder="Address line 1" autocomplete="address-line1">
    <input id="line2" placeholder="Apartment, suite, etc. (optional)" autocomplete="address-line2">
    <div class="three"><input id="city" placeholder="City" autocomplete="address-level2"><input id="state" placeholder="State" maxlength="2" autocomplete="address-level1" style="text-transform:uppercase"><input id="zip" placeholder="ZIP" inputmode="numeric" autocomplete="postal-code"></div>
   </div>

   <h4>Shipping method</h4>
   <div id="ship"></div>

   <div id="msg" role="alert"></div>
   <button id="pay" type="button">Pay</button>
   <p class="fine">By paying, you agree to Layerly’s terms and 30-day return policy.<br>Payments are processed securely by <b>Stripe</b>.</p>
  </div>
 </div></section>
</div>

<script>
(async()=>{
'use strict';
const $=s=>document.querySelector(s),money=c=>'$'+(c/100).toFixed(2);
let cart=[],promo=null,Q=null,ship='standard',stripe,elements,pe,ex,cardOnly=false;
try{cart=JSON.parse(localStorage.getItem('lay_cart')||'[]');promo=JSON.parse(localStorage.getItem('lay_promo')||'null')}catch(e){}
const items=()=>cart.map(i=>i.custom?{custom:1,fileKey:i.fileKey,mat:i.mat,layer:i.layer,infill:i.infill,finish:i.finish,qty:i.qty}:{id:i.id,mat:i.mat,size:i.size,color:i.color,qty:i.qty});
const okEm=()=>/^\S+@\S+\.\S+$/.test($('#email').value.trim());
const api=async(path,body)=>{
 const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||'Something went wrong. Please try again.');return d};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=t=>{$('#msg').textContent=t||''};

if(!Array.isArray(cart)||!cart.length){$('#empty').hidden=false;return}

function render(){
 $('#big').textContent=money(Q.total);
 $('#lines').innerHTML=Q.lines.map(l=>`<div class="line"><div>${esc(l.name)}<small>${esc(l.detail)} · Qty ${l.qty}</small></div><div>${money(l.total)}</div></div>`).join('');
 const sp=Q.options[Q.shipping];
 $('#sum').innerHTML=`<div class="row m"><span>Subtotal</span><span>${money(Q.sub)}</span></div>`+
  (Q.discount?`<div class="row g"><span>Promo (−${Q.pct}%)</span><span>−${money(Q.discount)}</span></div>`:'')+
  `<div class="row m"><span>Shipping</span><span>${sp?money(sp):'Free'}</span></div>`+
  `<div class="row m"><span>Est. tax (8%)</span><span>${money(Q.tax)}</span></div>`+
  `<hr><div class="row t"><span>Total due today</span><span>${money(Q.total)}</span></div>`;
 $('#pay').textContent='Pay '+money(Q.total);
 const o=Q.options,lab=v=>v?money(v):'Free';
 $('#ship').innerHTML=
  `<label class="opt"><span><input type="radio" name="sm" value="standard" ${ship==='standard'?'checked':''}>Standard <small>&nbsp;3–5 days</small></span><span>${lab(o.standard)}</span></label>`+
  `<label class="opt"><span><input type="radio" name="sm" value="express" ${ship==='express'?'checked':''}>Express <small>&nbsp;1–2 days</small></span><span>${lab(o.express)}</span></label>`;
}
const totalFor=id=>Q.sub-Q.discount+Q.tax+Q.options[id];
async function refresh(){
 Q=await api('/api/quote',{items:items(),promo,shipping:ship});render();
 if(elements)elements.update({amount:Q.total});
}

try{await refresh()}catch(e){
 $('#empty').hidden=false;$('#empty').innerHTML=`<p>${esc(e.message)}</p><a href="/">Back to the shop</a>`;return}
$('#form').hidden=false;
fetch('/api/auth/me').then(r=>r.json()).then(d=>{if(d.user&&!$('#email').value)$('#email').value=d.user.email}).catch(()=>{});
$('#ship').addEventListener('change',async e=>{if(e.target.name==='sm'){ship=e.target.value;try{await refresh()}catch(x){msg(x.message)}}});

if(!Q.publishableKey||typeof Stripe==='undefined'){msg('Payments are not set up yet. Add STRIPE_PUBLISHABLE_KEY in Cloudflare.');$('#pay').disabled=true;return}
stripe=Stripe(Q.publishableKey);
function boot(){
elements=stripe.elements({mode:'payment',amount:Q.total,currency:'usd',...(cardOnly?{paymentMethodTypes:['card']}:{}),appearance:{theme:'stripe',variables:{colorPrimary:'#1556d6',colorText:'#1a1f36',fontFamily:'Inter,system-ui,sans-serif',borderRadius:'8px',spacingUnit:'4px'}}});

/* Card form (name/email/address come from our own fields) */
pe=elements.create('payment',{layout:{type:'tabs'},wallets:{applePay:'never',googlePay:'never'},
 fields:{billingDetails:{name:'never',email:'never',address:'never'}}});
pe.mount('#payment');
pe.on('loaderror',e=>{if(!cardOnly){cardOnly=true;try{pe.destroy();ex.destroy()}catch(x){}boot();return}
 msg('Payment form could not load: '+((e&&e.error&&e.error.message)||'check your Stripe keys and that both are from the same account/mode.'))});

/* Google Pay / Apple Pay button */
const rates=()=>[ship,ship==='standard'?'express':'standard'].map(id=>({id,displayName:id==='standard'?'Standard (3–5 days)':'Express (1–2 days)',amount:Q.options[id]}));
ex=elements.create('expressCheckout',{buttonHeight:52,paymentMethods:{applePay:'auto',googlePay:'auto',link:'never',amazonPay:'never',paypal:'never',klarna:'never'}});
ex.mount('#express');
ex.on('ready',({availablePaymentMethods})=>{if(availablePaymentMethods)$('#exwrap').hidden=false});
ex.on('click',e=>{elements.update({amount:totalFor(ship)});e.resolve({emailRequired:!okEm(),shippingAddressRequired:true,allowedShippingCountries:['US'],shippingRates:rates()})});
ex.on('shippingaddresschange',e=>e.resolve({shippingRates:rates()}));
ex.on('shippingratechange',e=>{elements.update({amount:totalFor(e.shippingRate.id)});e.resolve({})});
ex.on('confirm',async ev=>{
 try{
  const {error:se}=await elements.submit();if(se)throw new Error(se.message);
  const sa=ev.shippingAddress||{},ad=sa.address||{};
  const r=await api('/api/payment-intent',{cardOnly,items:items(),promo,shipping:ev.shippingRate?ev.shippingRate.id:ship,
   email:okEm()?$('#email').value.trim():ev.billingDetails.email,name:sa.name||ev.billingDetails.name,address:{line1:ad.line1,line2:ad.line2,city:ad.city,state:ad.state,postal_code:ad.postal_code,country:ad.country}});
  const {error}=await stripe.confirmPayment({elements,clientSecret:r.clientSecret,confirmParams:{return_url:location.origin+'/?checkout=success'}});
  if(error)throw new Error(error.message);
 }catch(err){ev.paymentFailed({reason:'fail'});msg(err.message)}
});

}
boot();

/* Card pay button */
const need=['email','name','line1','city','state','zip'];
$('#pay').onclick=async()=>{
 msg('');let ok=true;
 need.forEach(id=>{const el=$('#'+id),good=id==='email'?/^\S+@\S+\.\S+$/.test(el.value.trim()):el.value.trim().length>(id==='state'?1:id==='zip'?2:1);el.classList.toggle('bad',!good);if(!good)ok=false});
 if(!ok){msg('Please fill in the highlighted fields.');return}
 const b=$('#pay'),label=b.textContent;b.disabled=true;b.textContent='Processing…';
 try{
  const v=id=>$('#'+id).value.trim(),addr={line1:v('line1'),line2:v('line2'),city:v('city'),state:v('state').toUpperCase(),postal_code:v('zip'),country:v('country')};
  const {error:se}=await elements.submit();if(se)throw new Error(se.message);
  const r=await api('/api/payment-intent',{cardOnly,items:items(),promo,shipping:ship,email:v('email'),name:v('name'),address:addr});
  const {error}=await stripe.confirmPayment({elements,clientSecret:r.clientSecret,confirmParams:{
   return_url:location.origin+'/?checkout=success',receipt_email:v('email'),
   shipping:{name:v('name'),address:addr},
   payment_method_data:{billing_details:{name:v('name'),email:v('email'),address:addr}}}});
  if(error)throw new Error(error.message);
 }catch(err){msg(err.message);b.disabled=false;b.textContent=label}
};
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>i.classList.remove('bad')));
})();
</script>
<script>
/* Tab "come back" message */
(()=>{
 const msgs=['🛒 Don’t miss our quality products','🖨️ Your favorites are waiting!'];
 let orig=document.title,t=null,i=0;
 const stop=()=>{clearInterval(t);t=null};
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
   orig=document.title;i=0;document.title=msgs[0];
   t=setInterval(()=>{i=(i+1)%msgs.length;document.title=msgs[i]},2500);
  }else{stop();document.title=orig}
 });
})();
</script>
</body>
</html>
