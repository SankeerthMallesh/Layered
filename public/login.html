<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Layerly</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;font-family:Inter,system-ui,sans-serif;color:#f4f4fb;background:radial-gradient(900px 500px at 20% 0,#2a1d6b55,transparent),radial-gradient(800px 500px at 90% 100%,#0e5d6e55,transparent),#0b0b12}
.c{width:100%;max-width:400px;padding:2rem;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px -20px #000}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.2rem;color:inherit;text-decoration:none;margin-bottom:1.2rem}
h1{font-size:1.5rem;margin:.2rem 0 .3rem}p{color:#a3a3b8;margin:0 0 1.2rem;font-size:.92rem}
.b{display:flex;align-items:center;justify-content:center;gap:.7rem;width:100%;padding:.8rem;margin-bottom:.6rem;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:inherit;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.b:hover{background:rgba(255,255,255,.12)}.b svg{width:20px;height:20px}.p{background:linear-gradient(135deg,#7c5cff,#22d3ee);border:0;color:#fff}
.or{display:flex;align-items:center;gap:.8rem;color:#8a8aa0;font-size:.75rem;margin:1rem 0}.or:before,.or:after{content:"";flex:1;border-top:1px solid rgba(255,255,255,.14)}
input{width:100%;padding:.8rem 1rem;margin-bottom:.7rem;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:inherit;font:inherit}
#code{letter-spacing:.5em;text-align:center;font-size:1.5rem}.e{color:#ff6b81;font-size:.85rem;min-height:1.2em;margin:.3rem 0}.l{background:none;border:0;color:#9fb0ff;cursor:pointer;font:inherit;font-size:.85rem;padding:.3rem 0}.l:disabled{color:#777;cursor:default}[hidden]{display:none!important}</style></head><body>
<div class="c"><a class="logo" href="/">&#9660; Layerly</a>
<div id="s1"><h1>Log in or sign up</h1><p>One account for orders, custom prints and reviews.</p>
<a class="b" id="bg" href="#" hidden><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</a>
<a class="b" id="bh" href="#" hidden><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.300.8-1.600-2.600-.3-5.300-1.300-5.300-5.700 0-1.300.5-2.300 1.200-3.100-.1-.3-.5-1.500.1-3.100 0 0 1-.3 3.200 1.200a11 11 0 0 1 5.800 0c2.200-1.500 3.200-1.200 3.200-1.200.6 1.600.2 2.800.1 3.100.8.800 1.200 1.800 1.200 3.100 0 4.400-2.700 5.400-5.300 5.700.4.400.8 1.100.8 2.200v3.200c0 .4.2.7.8.6A11.500 11.500 0 0 0 12 .5z"/></svg>Continue with GitHub</a>
<div class="or" id="or" hidden>OR</div>
<input id="em" type="email" placeholder="you@example.com" autocomplete="email"><button class="b p" id="go">Email me a code</button></div>
<div id="s2" hidden><h1>Check your email</h1><p>We sent a 6-digit code to <b id="to"></b>. It expires in 10 minutes.</p>
<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button class="b p" id="vf">Verify and continue</button>
<button class="l" id="rs">Resend code</button> &middot; <button class="l" id="ch">Use a different email</button></div>
<div class="e" id="err" role="alert"></div></div>
<script>
const $=s=>document.querySelector(s),q=new URLSearchParams(location.search),nx=/^\/(?!\/)/.test(q.get('next')||'')?q.get('next'):'/';
const post=async(u,b)=>{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong');return d};
const err=t=>$('#err').textContent=t||'';let em='',tm;err(q.get('error'));
fetch('/api/auth/me').then(r=>r.json()).then(d=>{if(d.user)location.href=nx});
fetch('/api/auth/providers').then(r=>r.json()).then(p=>{[['google','#bg'],['github','#bh']].forEach(([k,id])=>{if(p[k]){$(id).hidden=false;$(id).href='/api/auth/'+k+'?next='+encodeURIComponent(nx)}});$('#or').hidden=!(p.google||p.github);if(!p.email){$('#em').hidden=$('#go').hidden=true;$('#or').hidden=true;if(!p.google&&!p.github)err('Sign-in is not available yet. Please check back soon.')}}).catch(()=>{});
function wait(){let n=30;$('#rs').disabled=true;clearInterval(tm);tm=setInterval(()=>{n--;$('#rs').textContent=n>0?'Resend in '+n+'s':'Resend code';if(n<=0){clearInterval(tm);$('#rs').disabled=false}},1000);$('#rs').textContent='Resend in 30s'}
async function send(){err();const e=$('#em').value.trim().toLowerCase();$('#go').disabled=true;try{await post('/api/auth/send',{email:e});em=e;$('#to').textContent=e;$('#s1').hidden=true;$('#s2').hidden=false;$('#code').focus();wait()}catch(x){err(x.message)}$('#go').disabled=false}
$('#go').onclick=send;$('#em').onkeydown=e=>{if(e.key==='Enter')send()};
$('#rs').onclick=async()=>{err();try{await post('/api/auth/send',{email:em});wait()}catch(x){err(x.message)}};
$('#ch').onclick=()=>{$('#s2').hidden=true;$('#s1').hidden=false;$('#code').value='';err()};
async function verify(){err();$('#vf').disabled=true;try{await post('/api/auth/verify',{email:em,code:$('#code').value.trim()});location.href=nx}catch(x){err(x.message);$('#vf').disabled=false}}
$('#vf').onclick=verify;$('#code').onkeydown=e=>{if(e.key==='Enter')verify()};$('#code').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'');if(e.target.value.length===6)verify()};
</script></body></html>
